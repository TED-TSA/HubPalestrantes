<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Hub do Palestrante</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="palco">
    <!-- O src do vídeo é anexado pelo login.js só quando vale a pena: em tela
         grande, sem economia de dados e sem preferência por menos movimento.
         No celular fica o poster, que é um frame do próprio vídeo. -->
    <video class="fundo" id="fundo" poster="/public/login/fundo.jpg"
           autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="veu"></div>
    <div class="refletor"></div>

    <main class="entrada">
      <div class="caixa">
        <p class="eyebrow">TradeStars</p>
        <h1>Hub do<br>Palestrante</h1>
        <p class="conduz">Entre para ver os eventos, os leads e as vendas das suas palestras.</p>

        <form id="form" novalidate>
          <label class="campo">
            <span>Email</span>
            <input type="email" name="email" autocomplete="username"
                   placeholder="voce@tradestars.com.br" required autofocus>
          </label>
          <label class="campo">
            <span>Senha</span>
            <input type="password" name="senha" autocomplete="current-password" required>
          </label>
          <p class="erro" id="erro" role="alert"></p>
          <button class="botao" type="submit" id="enviar">Entrar</button>
        </form>

        <p class="rodape">Não tem acesso? Fale com a gestão para liberarem seu login.</p>
      </div>
    </main>
  </div>

  <script src="/login.js" type="module"></script>
</body>
</html>
