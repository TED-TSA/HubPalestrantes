<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub do Palestrante</title>
  <!-- Roda antes da folha de estilo para a página já nascer na cor certa. Se
       ficasse no app.js, ela piscaria escura antes de virar clara. -->
  <script>
    (function () {
      var t = localStorage.getItem('hub-tema');
      if (t !== 'claro' && t !== 'escuro') {
        t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
      }
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca-bloco">
      <span class="selo-ts">TS</span>
      <a class="marca" href="#/">Hub do palestrante</a>
      <span class="fio-vertical"></span>
      <span class="sub">TradeStars</span>
    </div>
    <nav id="menu" class="eu"></nav>
  </header>
  <main id="app" class="conteudo"></main>
  <script src="/app.js" type="module"></script>
</body>
</html>
