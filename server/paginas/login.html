<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Hub do Palestrante</title>
  <!-- Mesma resolução de tema do app, para o login não abrir numa cor e o Hub
       em outra. -->
  <script>
    (function () {
      var t = localStorage.getItem('hub-tema');
      if (t !== 'claro' && t !== 'escuro') {
        t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
      }
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="preload" href="/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="pagina-login">
  <div class="cartao">

    <aside class="vitrine">
      <!-- O src do vídeo é anexado pelo login.js só quando vale a pena: em tela
           grande, sem economia de dados e sem preferência por menos movimento.
           Nos outros casos fica o poster, que é um frame do próprio vídeo. -->
      <video class="vitrine-video" id="fundo" poster="/login/fundo.jpg"
             autoplay muted loop playsinline aria-hidden="true"></video>
      <div class="vitrine-veu"></div>

      <div class="vitrine-conteudo">
        <div class="vitrine-marca">
          <svg class="selo-ts" viewBox="0 0 36 36" aria-hidden="true">
            <path fill="currentColor" d="M0.275752 18.9946C0.670222 19.7525 4.73816 20.5472 6.08182 21.1523C11.173 23.4568 13.959 27.4423 15.7649 32.5219C16.2148 33.7933 15.9682 34.9547 17.2441 36H18.0392C20.4924 34.8753 20.4061 31.6233 21.6881 29.1294C23.2968 25.9997 25.8485 23.3773 28.9488 21.6841C31.3773 20.3638 33.9229 20.1926 36 18.585V17.7904C35.0508 15.3942 32.1231 15.6204 29.8672 14.5751C25.5466 12.5701 22.3907 8.64582 20.6464 4.32416C19.9931 2.69208 20.4184 0.0880825 18.218 0.00250512C15.58 -0.0952975 16.1223 2.69208 15.3272 4.60534C13.6507 8.64581 10.7169 12.3012 6.74754 14.3C4.59644 15.382 -1.3576 15.816 0.281921 18.9823L0.275752 18.9946Z"/>
          </svg>
          <span class="marca">TradeStars</span>
        </div>

        <div class="regua"></div>
        <h1>Hub do<br>palestrante</h1>

        <div class="rodape">
          <span>© 2026 Tradestars</span>
          <span>Nossos palestrantes</span>
        </div>
      </div>
    </aside>

    <main class="acesso">
      <div class="acesso-miolo">
        <h2>Bem-vindo de volta</h2>
        <p class="conduz">Entre com suas credenciais para continuar.</p>

        <form id="form" novalidate>
          <div class="campo-icone">
            <label for="email">Email</label>
            <div class="entrada">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="m3.5 7.5 8.5 6 8.5-6"/>
              </svg>
              <input type="email" id="email" name="email" autocomplete="username"
                     placeholder="seu@tradestars.com.br" required autofocus>
            </div>
          </div>

          <div class="campo-icone">
            <label for="senha">Senha</label>
            <div class="entrada">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="1"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              </svg>
              <input type="password" id="senha" name="senha" autocomplete="current-password" required>
              <button type="button" class="olho" id="olho" aria-label="Mostrar senha" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="2.8"/>
                </svg>
              </button>
            </div>
          </div>

          <label class="lembrar">
            <input type="checkbox" name="manter" id="manter" checked>
            <span>Manter conectado</span>
          </label>

          <p class="erro" id="erro" role="alert"></p>

          <button class="botao-acesso" type="submit" id="enviar">
            <span id="rotulo">Acessar o hub</span>
            <span class="seta" aria-hidden="true">→</span>
          </button>
        </form>

        <div class="rodape-acesso">
          <p class="restrito">Acesso restrito a colaboradores</p>
          <button class="troca-tema" type="button" id="tema">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2"/>
              <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
            </svg>
            <span id="rotulo-tema"></span>
          </button>
        </div>
      </div>
    </main>

  </div>

  <script src="/login.js" type="module"></script>
</body>
</html>
